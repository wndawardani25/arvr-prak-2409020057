
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene Perkenalan Diri - Winda Wardani</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
    <a-scene background="color: #eadfff">

        <!-- Pencahayaan -->
        <a-entity
            light="type: ambient; color: #ffffff; intensity: 1.5">
        </a-entity>

        <a-entity
            light="type: directional; color: #ffffff; intensity: 2"
            position="-3 5 2">
        </a-entity>

        <!-- Lantai -->
        <a-plane
            position="0 0 -4"
            rotation="-90 0 0"
            width="12"
            height="12"
            color="#ffcce6">
        </a-plane>

        <!-- Langit -->
        <a-sky color="#eadfff"></a-sky>

        <!-- Teks perkenalan -->
        <a-text
            value="Nama: Winda Wardani"
            position="0 2.55 -4"
            align="center"
            color="#78245d"
            width="5">
        </a-text>

        <a-text
            value="NIM: 2409020057"
            position="0 2.2 -4"
            align="center"
            color="#78245d"
            width="4">
        </a-text>

        <!-- Objek 1: Kubus -->
        <a-box
            position="-2 0.6 -4"
            width="1"
            height="1"
            depth="1"
            color="#ff69b4"
            rotation="0 30 0">
        </a-box>

        <!-- Objek 2: Bola -->

        <!-- Objek 2: Bola dengan animasi berputar -->
        <a-sphere
            position="0 0.9 -5.5"
            radius="0.65"
            color="#c084fc"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
        </a-sphere>

        <!-- Objek 3: Tabung -->
        <a-cylinder
            position="2 0.75 -4"
            radius="0.45"
            height="1.5"
            color="#ffb3d9">
        </a-cylinder>

        <!-- Objek 4: Kerucut -->
        <a-cone
            position="-3 0.5 -6"
            radius-bottom="0.6"
            radius-top="0.05"
            height="1"
            color="#f9a8d4">
        </a-cone>

        <!-- Objek 5: Torus -->

        <!-- Objek 5: Torus dengan animasi -->
        <a-torus
            position="3 1.5 -6"
            radius="0.6"
            radius-tubular="0.12"
            color="#a78bfa"
            animation="property: rotation; to: 360 360 0; loop: true; dur: 8000; easing: linear">
        </a-torus>

        <!-- Kamera -->
        <a-entity
            camera
            position="0 1.6 0"
            look-controls
            wasd-controls>
        </a-entity>

    </a-scene>
</body>
</html>
